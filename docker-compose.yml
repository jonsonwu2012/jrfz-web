services:
  cms:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: "0.0.0.0"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-junrong-admin}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SEED_DIR: /app/seed/content
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - cms-content:/app/content
      - cms-uploads:/app/uploads
    restart: unless-stopped

volumes:
  cms-content:
  cms-uploads:
